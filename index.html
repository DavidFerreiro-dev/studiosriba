<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="TAxNUPT2bfT8zzuowsMSgGq5HZyC8T_v-_BbDSbmfPc" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studios Riba — Desarrolladora independiente de videojuegos inmersivos y productora de cortometrajes de autor. Elige tu universo: Juega o mira.">
  <meta name="keywords" content="Studios Riba, videojuegos indie, cortometrajes, cine independiente, desarrollo de videojuegos, España">
  
  <!-- OpenGraph / Social Media -->
  <meta property="og:title" content="Studios Riba — Elige tu universo">
  <meta property="og:description" content="Desarrolladora independiente de videojuegos y productora de cortometrajes. Entra y elige tu universo.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/media/favicon.jpg">
  <meta property="og:url" content="https://studiosriba.github.io">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@_studiosriba">
  <meta name="twitter:title" content="Studios Riba — Elige tu universo">
  <meta name="twitter:description" content="Desarrolladora independiente de videojuegos y productora de cortometrajes. Entra y elige tu universo.">
  <meta name="twitter:image" content="/media/favicon.jpg">

  <title>Studios Riba — Elige tu universo</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/media/favicon.jpg">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="index" class="scanlines">

  <!-- ── LOADER ─────────────────────────────────────────────────── -->
  <div id="loader" role="status" aria-label="Cargando Studios Riba">
    <div class="loader-content">
      <img src="/media/StudiosRiba.png" alt="Studios Riba" class="loader-logo">
    </div>
  </div>

  <!-- ── PAGE FLASH ─────────────────────────────────────────────── -->
  <div id="page-flash" aria-hidden="true"></div>

  <!-- ── CURSOR ─────────────────────────────────────────────────── -->
  <div id="cursor-dot" aria-hidden="true"></div>
  <div id="cursor-trail" aria-hidden="true"></div>

  <!-- ── PARTICLES ──────────────────────────────────────────────── -->
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <!-- ── SPLIT SCREEN ───────────────────────────────────────────── -->
  <main class="split-screen" id="main-content">

    <!-- LEFT: Studios Riba -->
    <section
      class="split-left"
      data-side="sr"
      role="button"
      tabindex="0"
      aria-label="Entrar a Studios Riba, desarrolladora de videojuegos">
      <div class="split-content">
        <div class="split-logo">
          <img src="/media/StudiosRiba.png" alt="Studios Riba logo" width="360" height="180">
        </div>
        <p class="split-sublabel">Desarrolladora de Videojuegos</p>
        <span class="split-label" aria-hidden="true">ENTER</span>
        <p class="split-description">
          Creando mundos interactivos desde el código hasta la experiencia.
        </p>
      </div>
    </section>

    <!-- Divider -->
    <div class="divider-line" aria-hidden="true"></div>

    <!-- RIGHT: Studios Riba Productions -->
    <section
      class="split-right"
      data-side="srp"
      role="button"
      tabindex="0"
      aria-label="Entrar a Studios Riba Productions, productora de cortometrajes">
      <div class="split-content">
        <div class="split-logo">
          <img src="/media/SRProductions.png" alt="Studios Riba Productions logo" width="360" height="180">
        </div>
        <p class="split-sublabel">Productora de Cortometrajes</p>
        <span class="split-label" aria-hidden="true">ENTER</span>
        <p class="split-description">
          Historias que trascienden la pantalla y perduran en la memoria.
        </p>
      </div>
    </section>

  </main>

  <script src="/script.js"></script>
</body>
</html>
